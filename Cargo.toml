[package]
name = "fasterANI"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "faster_ani"
path = "src/lib.rs"

[[bin]]
name = "fasterANI"
path = "src/main.rs"

[dependencies]
boomphf = { version = "0.6.0", features = ["serde"] }
bstr = "1.12.1"
flate2 = "1.1.4"
gzp = "2.0.2"
libc = "0.2.186"
noodles = { version = "0.111.0", features = ["fasta"] }
rayon = "1.11.0"
rustc-hash = "2"
seq-hash = "0.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-minimizers = "2.3.1"
thiserror = "2"

[profile.performance]
inherits = "release"
debug = true
debug-assertions = true
