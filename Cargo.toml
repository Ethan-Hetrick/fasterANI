[package]
name = "fasterANI"
version = "0.1.0"
edition = "2021"

[lib]
name = "faster_ani"
path = "src/lib.rs"

[[bin]]
name = "fasterANI"
path = "src/main.rs"

[dependencies]
boomphf = { version = "0.6.0", features = ["serde"] }
bstr = "1.12.1"
flate2 = "1.1.4"
gzp = "2.0.2"
libc = "0.2.186"
noodles = { version = "0.111.0", features = ["fasta"] }
rayon = "1.11.0"
rustc-hash = "2"
seq-hash = "0.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-minimizers = "2.3.1"
thiserror = "2"
toml = "0.8"
dhat = { version = "0.3", optional = true }

[dev-dependencies]
iai-callgrind = "0.8.0"
criterion = "0.8.2"

[features]
dhat-heap = ["dep:dhat"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.performance]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev]
debug = true
debug-assertions = true
overflow-checks = true
strip = "none"
